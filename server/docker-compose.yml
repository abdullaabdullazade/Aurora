services:
  aurora:
    build: .
    container_name: aurora-server
    restart: unless-stopped
    # Host networking keeps the LAN IP / port that _register_loop publishes to
    # the registry identical to what the app can reach.
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - ./cache:/app/cache
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
