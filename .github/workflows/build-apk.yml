name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_version="${GITHUB_REF_NAME#v}"
            flutter build apk --release \
              --build-name="$release_version" \
              --build-number="$GITHUB_RUN_NUMBER"
          else
            flutter build apk --release
          fi

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Aurora-Music.apk
          cd dist
          sha256sum Aurora-Music.apk > Aurora-Music.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-music-apk
          path: |
            dist/Aurora-Music.apk
            dist/Aurora-Music.apk.sha256
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Aurora-Music.apk \
            dist/Aurora-Music.apk.sha256 \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "Aurora Music $GITHUB_REF_NAME"
