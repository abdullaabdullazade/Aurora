name: aurora_music
description: Premium media downloader & player — Spotify-grade soft dark UI.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0" # Color.withValues() requires 3.27+

dependencies:
  flutter:
    sdk: flutter

  # State management (Clean Architecture / Presentation layer)
  flutter_riverpod: ^2.5.1

  # Audio / Video core
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  video_player: ^2.9.1

  # Networking / scraping
  dio: ^5.7.0
  youtube_explode_dart: ^2.3.2

  # Local DB (offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Downloads
  flutter_downloader: ^1.11.8
  permission_handler: ^11.3.1

  # UI helpers
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  animations: ^2.0.11
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
