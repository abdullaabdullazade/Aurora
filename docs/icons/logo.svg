<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141A2B"/>
      <stop offset="1" stop-color="#0B0C10"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E676"/>
      <stop offset="0.55" stop-color="#1DB954"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64FFDA" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7C4DFF" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="96" height="96" rx="24" fill="url(#sky)"/>

  <!-- aurora curtains -->
  <path d="M14 62c8-22 20-34 34-34s26 10 34 26" stroke="url(#aurora)" stroke-width="7"
        stroke-linecap="round" fill="none" opacity="0.95"/>
  <path d="M20 72c7-18 17-28 28-28s21 8 28 20" stroke="url(#aurora2)" stroke-width="4"
        stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- note head + stem, sitting under the curtain -->
  <circle cx="40" cy="66" r="8" fill="#FFFFFF"/>
  <path d="M48 66V40l14-4v6l-14 4" fill="#FFFFFF"/>
</svg>
